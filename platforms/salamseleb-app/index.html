<title>SalamSeleb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700;800&family=Noto+Sans+Arabic:wght@400;500;700;800&display=swap">
<style>
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E8EEEA; --line:#D8E0DB;
  --ink:#13201B; --ink-2:#44524C; --muted:#75837D;
  --accent:#D93D74; --accent-soft:#FBE3EC; --accent-ink:#FFFFFF;
  --deep:#0F3B33; --deep-ink:#F1F7F4; --gold:#D98E1E; --gold-soft:#FBEBD1;
  --ok:#1F8A5B; --ok-soft:#DDF2E7; --warn:#B26A00; --warn-soft:#FBEBD2; --bad:#C0392B; --bad-soft:#F9DEDB;
  --shadow:0 10px 30px -12px rgba(15,59,51,.28);
  --font:"Plus Jakarta Sans","Noto Sans KR","Noto Sans SC","Noto Sans JP","Noto Sans Arabic","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#0D1412; --surface:#16201C; --surface-2:#1E2A26; --line:#27342F;
    --ink:#E8F0EC; --ink-2:#B3C1BB; --muted:#83918B;
    --accent:#F0628F; --accent-soft:#3A1C28; --accent-ink:#1A0A10;
    --deep:#0A2923; --deep-ink:#E8F3EE; --gold:#EDA84A; --gold-soft:#3A2B14;
    --ok:#4CC08B; --ok-soft:#163127; --warn:#E5A140; --warn-soft:#3A2B12; --bad:#EF6B67; --bad-soft:#3D1D1C;
    --shadow:0 10px 30px -12px rgba(0,0,0,.6);}
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0D1412; --surface:#16201C; --surface-2:#1E2A26; --line:#27342F;
  --ink:#E8F0EC; --ink-2:#B3C1BB; --muted:#83918B;
  --accent:#F0628F; --accent-soft:#3A1C28; --accent-ink:#1A0A10;
  --deep:#0A2923; --deep-ink:#E8F3EE; --gold:#EDA84A; --gold-soft:#3A2B14;
  --ok:#4CC08B; --ok-soft:#163127; --warn:#E5A140; --warn-soft:#3A2B12; --bad:#EF6B67; --bad-soft:#3D1D1C;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6);}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:640px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.gutter{padding-inline:16px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:1px}
.brand b{color:var(--accent);font-weight:800}
.top .sp{flex:1}
.iconbtn{border:0;background:var(--surface);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.vbox{position:relative;align-self:flex-start;width:min(240px,100%);border-radius:14px;overflow:hidden;background:#000;-webkit-user-select:none;user-select:none}
.vbox.full{width:100%}
.vbox video{display:block;width:100%;max-height:420px;background:#000}
.vbox .wm{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center;overflow:hidden}
.vbox .wm span{transform:rotate(-24deg);font-weight:800;font-size:15px;letter-spacing:.08em;color:rgba(255,255,255,.34);text-shadow:0 1px 2px rgba(0,0,0,.4);white-space:nowrap;animation:wmdrift 9s linear infinite alternate}
@keyframes wmdrift{from{transform:translate(-18%,-30%) rotate(-24deg)}to{transform:translate(18%,30%) rotate(-24deg)}}
@media (prefers-reduced-motion:reduce){.vbox .wm span{animation:none}}
.vlabel{font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.vlabel.lock{color:var(--warn)}.vlabel.ok{color:var(--ok)}
.prog{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.langrow{align-items:center}
.sheet .list{max-height:62vh;overflow-y:auto}
[dir="rtl"] .iconbtn svg{transform:scaleX(-1)}
.brand{direction:ltr;unicode-bidi:isolate}
:root[lang="ja"] body,:root[lang="zh-Hans"] body{word-break:normal;line-break:strict}
[dir="rtl"] .card .tier{right:auto;left:7px}
[dir="rtl"] .card .ph .badge{left:auto;right:7px}
[dir="rtl"] .reply{border-left:0;border-right:3px solid var(--accent);border-radius:10px 0 0 10px}
[dir="rtl"] .item,[dir="rtl"] .card,[dir="rtl"] .choice{text-align:right}
[lang="ja"] body,[lang="ja"] button,[lang="ja"] input,[lang="ja"] textarea{font-family:"Plus Jakarta Sans","Noto Sans JP",var(--font)}
.langrow .flag{font-size:26px;line-height:1;flex:none}
.langrow[aria-pressed="true"]{background:var(--accent-soft)}
.langrow .chk{color:var(--accent);font-weight:800;font-size:18px}
.brand,.lang,.modechip,.testtag{white-space:nowrap;flex:none}
.top{gap:8px}
.modechip span:last-child{overflow:hidden;text-overflow:ellipsis}
@media (max-width:400px){.top .testtag{display:none}}
.modechip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 10px 3px 3px;font-size:12.5px;font-weight:800;cursor:pointer;max-width:120px}
.modechip .av{width:26px;height:26px;font-size:11px}
.modechip .gi{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:13px}
.modechip.m-fan{border-color:var(--accent);color:var(--accent)}
.modechip.m-seleb{border-color:var(--gold);color:var(--gold)}
.acctrow{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.acctrow:last-child{border-bottom:0}
.acctrow .tx{flex:1;min-width:0}
.acctrow b{display:block}.acctrow small{color:var(--muted);font-size:12.5px}
.acctrow.on{background:var(--accent-soft)}
.lang{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:700;cursor:pointer}
.testtag{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:99px;padding:3px 8px;white-space:nowrap}

/* Welcome */
.welcome{min-height:100%;display:flex;flex-direction:column;background:var(--deep);color:var(--deep-ink);padding:28px 20px calc(28px + env(safe-area-inset-bottom,0px))}
.welcome .brand{font-size:30px;color:var(--deep-ink)}
.welcome .brand b{color:#FF7AA5}
.welcome .hello{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.welcome .hello h1{font-size:30px;line-height:1.2;font-weight:800}
.welcome .hello p{margin:0;color:color-mix(in srgb,var(--deep-ink) 78%,transparent);font-size:15px;max-width:34ch}
.stack{display:flex;margin:22px 0 6px}
.stack .av{width:52px;height:52px;border:3px solid var(--deep);margin-left:-12px;font-size:17px}
.stack .av:first-child{margin-left:0}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.choice{display:flex;align-items:center;gap:14px;text-align:left;border:0;border-radius:18px;padding:16px;cursor:pointer;background:rgba(255,255,255,.08);color:var(--deep-ink)}
.choice.primary{background:#FF7AA5;color:#2A0714}
.choice .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:15px;background:rgba(255,255,255,.14);flex:none}
.choice.primary .ic{background:rgba(42,7,20,.12)}
.choice b{display:block;font-size:16px}
.choice small{display:block;font-size:13px;opacity:.8}
.linkbtn{border:0;background:none;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:12px;font-weight:600}
.welcome .note{font-size:12px;opacity:.7;text-align:center;margin-top:8px}

/* Sections */
.section{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.shead h2{font-size:17px;font-weight:800}
.shead button{border:0;background:none;color:var(--accent);font-weight:700;font-size:13.5px;cursor:pointer}
.hero{margin-top:6px;border-radius:22px;background:var(--deep);color:var(--deep-ink);padding:18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.hero h1{font-size:21px;font-weight:800;line-height:1.3}
.hero p{margin:0;font-size:13.5px;color:color-mix(in srgb,var(--deep-ink) 80%,transparent)}
.hero .cta{align-self:flex-start;margin-top:8px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Seleb cards */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(138px,34%,180px);gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.card{border:0;text-align:left;cursor:pointer;background:var(--surface);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:5px;box-shadow:0 1px 0 var(--line)}
.card .ph{aspect-ratio:1/1;border-radius:11px;display:grid;place-items:center;font-size:28px;font-weight:800;color:#fff;position:relative;overflow:hidden}
.card .ph .badge{position:absolute;left:7px;top:7px}
.card b{font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .srow{flex-wrap:nowrap;white-space:nowrap;gap:4px;max-width:100%;overflow:hidden}
.card .st5{font-size:11px;letter-spacing:0}
.card .srow{font-size:11.5px}
.card .badge,.card .tier{font-size:10px;padding:1px 6px}
.card{min-width:0}
.card .price{font-weight:800;font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;background:rgba(0,0,0,.35);color:#fff}
.badge.sample{background:var(--warn-soft);color:var(--warn)}
.stars{color:var(--gold);font-weight:700;font-size:12.5px}
.srow{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.srow b{color:var(--ink);font-weight:800}
.st5{position:relative;display:inline-block;line-height:1;letter-spacing:1px;color:var(--line);font-size:13px}
.st5 i{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--gold);font-style:normal}
.srow.lg{font-size:14px}.srow.lg .st5{font-size:22px;letter-spacing:2px}
.tier{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;border-radius:99px;padding:2px 9px;background:var(--tb);color:var(--tc);white-space:nowrap}
.tier::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-top{--tb:#2A1B3D;--tc:#F5C94A}.t-gold{--tb:var(--gold-soft);--tc:var(--gold)}.t-silver{--tb:var(--surface-2);--tc:var(--ink-2)}.t-rising{--tb:var(--ok-soft);--tc:var(--ok)}
.card .tier{position:absolute;right:7px;top:7px}
.tierbtn{border:0;background:none;padding:0;cursor:pointer}
.reply{margin-top:6px;border-left:3px solid var(--accent);padding:6px 10px;background:var(--surface-2);border-radius:0 10px 10px 0;font-size:13.5px;color:var(--ink-2)}
.reply b{display:block;font-size:12px;color:var(--accent)}
.newtag{font-size:11.5px;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:99px;padding:1px 8px}

.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;font-size:15px}
.av.lg{width:92px;height:92px;font-size:34px;border-radius:28px}
.av.pic{overflow:hidden;background:var(--surface-2)}
.av img,.card .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.av.xl{width:100px;height:100px;border-radius:28px;box-shadow:var(--shadow)}

/* Lists */
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:0 1px 0 var(--line)}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%;cursor:pointer}
.item:last-child{border-bottom:0}
.item .tx{flex:1;min-width:0}
.item .t1{font-weight:700;font-size:14.5px}
.item .t2{font-size:13px;color:var(--ink-2)}
.item .t3{font-size:12px;color:var(--muted);margin-top:2px}
.item .dot{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:13px;font-weight:800}
.dot.join{background:var(--ok-soft);color:var(--ok)}
.dot.req{background:var(--accent-soft);color:var(--accent)}
.dot.done{background:var(--gold-soft);color:var(--gold)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}

/* Profile */
.prof{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:6px}
.prof h1{font-size:23px;font-weight:800}
.prof .sub{color:var(--ink-2);font-size:14px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.fact{background:var(--surface);border-radius:14px;padding:10px;text-align:center;box-shadow:0 1px 0 var(--line)}
.fact b{display:block;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.fact small{font-size:12px;color:var(--muted)}
.bio{background:var(--surface);border-radius:16px;padding:14px;font-size:14.5px;color:var(--ink-2);white-space:pre-wrap;box-shadow:0 1px 0 var(--line)}
.review{font-size:13.5px}
.sticky{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(640px,100%);padding:10px 16px;box-sizing:border-box;z-index:6;background:linear-gradient(transparent,var(--bg) 30%)}

/* Buttons & forms */
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:15px;cursor:pointer;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.block{width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:11px}
.btn:disabled{opacity:.5;cursor:default}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.form{display:flex;flex-direction:column;gap:14px;margin-top:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;font-weight:700;color:var(--ink-2)}
.field small{font-size:12px;color:var(--muted)}
.input{width:100%;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px}
textarea.input{min-height:92px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer}
.seg input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2)}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
.summary{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 0 var(--line)}
.summary .ln{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.summary .ln b{font-variant-numeric:tabular-nums}
.escrow{font-size:12.5px;color:var(--ink-2);background:var(--gold-soft);border-radius:12px;padding:10px 12px}
.pagetitle{font-size:22px;font-weight:800;margin-top:4px}
.lead{color:var(--ink-2);font-size:14px;margin:4px 0 0}

/* Request cards */
.rq{background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 0 var(--line)}
.rq .hd{display:flex;gap:10px;align-items:center}
.rq .hd .tx{flex:1;min-width:0}
.rq .hd b{display:block;font-size:15px}
.rq .hd small{color:var(--muted);font-size:12.5px}
.rq .msg{font-size:14px;color:var(--ink-2);background:var(--surface-2);border-radius:12px;padding:10px 12px;white-space:pre-wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:800;white-space:nowrap;background:var(--sb);color:var(--sc)}
.st-requested{--sb:var(--accent-soft);--sc:var(--accent)}
.st-accepted{--sb:var(--warn-soft);--sc:var(--warn)}
.st-delivered{--sb:var(--gold-soft);--sc:var(--gold)}
.st-done{--sb:var(--ok-soft);--sc:var(--ok)}
.st-declined{--sb:var(--surface-2);--sc:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.steps i{height:4px;border-radius:99px;background:var(--surface-2)}
.steps i.on{background:var(--accent)}
.steplbl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;font-size:11px;color:var(--muted);margin-top:-4px}
.rate{display:flex;gap:4px}
.rate button{border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--line);padding:2px}
.rate button.on{color:var(--gold)}
.tabs2{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.tabs2 button{flex:1;border:0;background:none;border-radius:9px;padding:8px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--ink-2)}
.tabs2 button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* Bottom tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(640px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:7}
.tabbar button{border:0;background:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar svg{width:22px;height:22px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(640px,100%);background:var(--surface);border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{font-size:18px;font-weight:800}
.sheet p{margin:0;color:var(--ink-2);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:30;max-width:calc(100% - 40px);text-align:center}
.me-card{background:var(--surface);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 0 var(--line)}
.me-card .tx{flex:1;min-width:0}

// 분야에 맞는 사진 중에서 Seleb마다 무작위로 하나를 고정 배정 (id 해시)
const PHOTO_POOL={singer:[0,5,11],mc:[1,6,15],comedian:[7,1,12],creator:[2,9],actor:[4,9,6],athlete:[3,8,16],dancer:[10],magician:[13],chef:[14]};
// 겹치지 않게 배정: 먼저 등록한 Seleb부터 분야 사진 중 아직 안 쓴 것 → 없으면 남은 사진 → 10명을 넘으면 그때만 재사용
let photoMap=new Map(),photoKey="";
function assignPhotos(){
  const list=S.selebs.slice().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)||String(a.id).localeCompare(String(b.id)));
  const key=list.map(x=>x.id+":"+x.category+":"+(x.photo??"")).join("|");if(key===photoKey)return;photoKey=key;photoMap=new Map();
  const used=new Set();
  // 사진을 직접 지정한 Seleb(photo 번호)은 그 사진을 먼저 차지
  for(const x of list){if(x.photo===-1){photoMap.set(x.id,-1);continue;}if(Number.isInteger(x.photo)&&PHOTOS[x.photo]){used.add(x.photo);photoMap.set(x.id,x.photo);}}
  for(const x of list){if(photoMap.has(x.id))continue;const pool=PHOTO_POOL[x.category]||[];const start=hue(x.id);
    const pick=arr=>{for(let i=0;i<arr.length;i++){const k=arr[(start+i)%arr.length];if(!used.has(k))return k;}return null;};
    let k=pick(pool);if(k==null)k=pick(PHOTOS.map((_,i)=>i));

    used.add(k);photoMap.set(x.id,k);}

// 올릴 때 한 번 재생하면서 두 가지를 동시에 만든다:
//  ① 미리보기(긴 변 320px, 저화질, 팬 이름·주문번호 워터마크를 화면에 새김) → 정산 전 팬에게 보이는 유일한 영상
//  ② 원본(긴 변 1280px, 고화질) → 정산 완료 후에만 재생·다운로드 버튼이 나타남
const MAX_SEC=60, MAX_BYTES=20*1024*1024;
function pickMime(){const c=["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm","video/mp4;codecs=avc1,mp4a","video/mp4"];
  if(typeof MediaRecorder==="undefined")return null;for(const m of c){try{if(MediaRecorder.isTypeSupported(m))return m;}catch(e){}}return null;}
function baseType(m){return /mp4/.test(m||"")?"video/mp4":"video/webm";}
async function makeRenditions(file,wmText,onProg){
  const mime=pickMime();if(!mime)throw {code:"no_recorder"};
  const url=URL.createObjectURL(file);const v=document.createElement("video");v.src=url;v.playsInline=true;v.preload="auto";v.crossOrigin="anonymous";
  await new Promise((ok,no)=>{v.onloadedmetadata=ok;v.onerror=()=>no({code:"bad_video"});});
  if(!isFinite(v.duration)){ // 길이 정보가 없는 WebM: 끝으로 한 번 보내 길이를 알아낸 뒤 처음으로
    await new Promise(ok=>{const t=setTimeout(ok,4000);v.addEventListener("durationchange",function f(){if(isFinite(v.duration)){v.removeEventListener("durationchange",f);clearTimeout(t);ok();}});v.currentTime=1e101;});
    await new Promise(ok=>{v.addEventListener("seeked",ok,{once:true});v.currentTime=0;});}
  if(!isFinite(v.duration)||v.duration>MAX_SEC+0.5)throw {code:isFinite(v.duration)?"too_long":"bad_video"};
  const W=v.videoWidth||640,H=v.videoHeight||360;const ev=n=>Math.max(2,Math.round(n/2)*2);
  const s1=Math.min(1,1280/Math.max(W,H)),s2=320/Math.max(W,H);
  const c1=document.createElement("canvas"),c2=document.createElement("canvas");c1.width=ev(W*s1);c1.height=ev(H*s1);c2.width=ev(W*s2);c2.height=ev(H*s2);
  const x1=c1.getContext("2d"),x2=c2.getContext("2d");
  let audio=[];try{const AC=window.AudioContext||window.webkitAudioContext;const ac=new AC();await ac.resume();const src=ac.createMediaElementSource(v);const dst=ac.createMediaStreamDestination();src.connect(dst);audio=dst.stream.getAudioTracks();}catch(e){}
  const mk=(c,fps,vb,ab)=>{const st=new MediaStream([...c.captureStream(fps).getVideoTracks(),...audio.map(t=>t.clone())]);const r=new MediaRecorder(st,{mimeType:mime,videoBitsPerSecond:vb,audioBitsPerSecond:ab});const ch=[];r.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data);};return {r,ch,done:new Promise(ok=>{r.onstop=()=>ok(new Blob(ch,{type:baseType(mime)}));})};};
  const A=mk(c1,30,2000000,96000),B=mk(c2,20,280000,48000);
  const wm=()=>{x2.save();x2.globalAlpha=.42;x2.fillStyle="#fff";x2.strokeStyle="rgba(0,0,0,.45)";x2.lineWidth=2;x2.font="700 "+Math.round(c2.width/16)+"px sans-serif";x2.textAlign="center";
    x2.translate(c2.width/2,c2.height/2);x2.rotate(-0.42);const step=Math.round(c2.height/4);for(let y=-c2.height;y<=c2.height;y+=step){x2.strokeText(wmText,0,y);x2.fillText(wmText,0,y);}x2.restore();};
  let run=true;const draw=()=>{if(!run)return;try{x1.drawImage(v,0,0,c1.width,c1.height);x2.drawImage(v,0,0,c2.width,c2.height);wm();}catch(e){}onProg&&onProg(v.currentTime,v.duration);
    if(v.requestVideoFrameCallback)v.requestVideoFrameCallback(draw);else requestAnimationFrame(draw);};
  A.r.start(1000);B.r.start(1000);
  try{await v.play();}catch(e){v.muted=true;await v.play();}
  draw();
  await new Promise(ok=>{v.onended=ok;});run=false;A.r.stop();B.r.stop();
  const [full,prev]=await Promise.all([A.done,B.done]);URL.revokeObjectURL(url);

  return {full,prev,type:baseType(mime),dur:Math.round(v.duration)};
}
// MediaRecorder로 만든 WebM은 길이 정보가 비어 있을 수 있어, 한 번 끝으로 보냈다가 되돌린다
function fixDuration(v){v.addEventListener("loadedmetadata",()=>{if(v.duration===Infinity){v.currentTime=1e101;v.addEventListener("timeupdate",function f(){v.removeEventListener("timeupdate",f);v.currentTime=0;});}});}

  hd.append(os?photoAvatar(os):avatar(other.name,other.id),tx,el("span","pill st-"+r.status,T("s_"+r.status)));
  c.append(hd);
  if(r.status!=="declined"){const steps=el("div","steps");const n=STEP[r.status]||0;for(let i=1;i<=4;i++){const x=el("i",i<=n?"on":null);steps.append(x);}const lb=el("div","steplbl");["st1","st2","st3","st4"].forEach(k=>lb.append(el("span",null,T(k))));c.append(steps,lb);}
  c.append(el("div","msg",r.note||""));
  if(r.previewId||r.fullId){
    const paid=r.status==="done";
    if(paid&&r.fullId){c.append(el("div","vlabel ok","✓ "+T("fullLbl")),videoBox(r.fullId,{full:true}));
      if(side==="fan"&&S.downloads){const d=btn("btn sm dark","⬇ "+T("download"));d.addEventListener("click",()=>saveVideo(r,d));c.append(d);}}
    else{c.append(el("div","vlabel lock","🔒 "+(side==="seleb"?T("sentPreview")+" · ":"")+T("previewLbl")),videoBox(r.previewId||r.fullId,{wm:"SalamSeleb · "+T("wmPreview")}));
      if(side==="fan")c.append(el("small",null,T("lockNote")));}
  }
  if(r.deliveryNote)c.append(el("div","msg","🎬 "+r.deliveryNote));
  const meta=el("small");meta.style.color="var(--muted)";meta.textContent=T("wantDate")+" "+(r.date||"—")+" · "+T("lang")+" "+T("lg_"+r.lang)+" · "+ago(r.createdAt);c.append(meta);
  const act=el("div","row2");
  const upd=async(patch,msg)=>{if(!guardWrite())return;try{await S.db.doc("requests/"+r.id).update(Object.assign(patch,{updatedAt:Date.now()}));if(msg)toast(msg);}catch(e){toast(writeErr(e));}};
  if(side==="seleb"&&r.status==="requested"){act.append(btn("btn sm",T("accept"),()=>upd({status:"accepted"},T("s_accepted"))),btn("btn sm ghost",T("decline"),()=>upd({status:"declined"},T("s_declined"))));}
  if(side==="seleb"&&r.status==="accepted"){act.append(btn("btn sm","🎬 "+T("attach"),()=>sheetUpload(r)));}
  if(side==="fan"&&r.status==="delivered"){let rating=5;const rt=el("div","rate");rt.setAttribute("role","radiogroup");rt.setAttribute("aria-label",T("rateIt"));
    const paint=()=>[...rt.children].forEach((b,i)=>{b.classList.toggle("on",i<rating);b.setAttribute("aria-checked",String(i+1===rating));});
    for(let i=1;i<=5;i++){const b=btn(null,"★",()=>{rating=i;paint();});b.setAttribute("role","radio");b.setAttribute("aria-label",i+"");rt.append(b);}paint();
    const rv=el("textarea","input");rv.id="rv-"+r.id;rv.placeholder=T("reviewPh");rv.maxLength=200;rv.style.minHeight="56px";const rl=el("label","sr",T("reviewPh"));rl.htmlFor=rv.id;
    c.append(el("small",null,T("rateIt")),rt,rl,rv);act.append(btn("btn sm",T("confirm"),()=>upd({status:"done",rating,review:rv.value.trim()},T("s_done"))));}
  if(r.status==="done"&&r.rating){c.append(el("div","stars","★".repeat(r.rating)+"☆".repeat(5-r.rating)));if(r.review)c.append(el("div","msg","“"+r.review+"”"));
    if(r.reply){const rp2=el("div","reply");rp2.append(el("b",null,T("replyLbl")),document.createTextNode(r.reply));c.append(rp2);}
    else if(side==="seleb")c.append(replyForm(r));}
  if(act.children.length)c.append(act);
  return c;
}

/* ---------- Me ---------- */
function viewMe(){
  const g=el("div","gutter");const sel=mySeleb(),fan=myFan();const cur=asFan()||asSeleb();
  g.append(el("h1","pagetitle",T("me")),el("p","lead",cur?T("nowAs").replace("{r}",T(S.as==="fan"?"mFan":"mSeleb"))+" · "+cur.name:T("nowGuest")));
  const s=el("section","section");const l=el("div","list");
  for(const role of ["fan","seleb"]){const reg=role==="fan"?fan:sel;const on=S.as===role&&reg;
    const row=el("div","acctrow"+(on?" on":""));const tx=el("div","tx");tx.append(el("small",null,T(role==="fan"?"roleB":"roleA")),el("b",null,reg?reg.name:T("notYet")));
    if(reg&&reg.price)tx.append(el("small",null,T("cat_"+reg.category)+" · "+rp(reg.price)));
    row.append(reg?(role==="seleb"?photoAvatar(reg):avatar(reg.name,S.uid+"f")):avatar("?","x"),tx);
    const acts=el("div","row2");acts.style.justifyContent="flex-end";
    if(!reg)acts.append(btn("btn sm",T("register"),()=>login(role)));
    else{if(!on)acts.append(btn("btn sm",T("loginAs").replace("{r}",T(role==="fan"?"mFan":"mSeleb")),()=>login(role)));else acts.append(el("span","pill st-done","✓ "+T(role==="fan"?"mFan":"mSeleb")));
      if(on)acts.append(btn("btn sm ghost",T("edit"),()=>go(role==="fan"?"joinB":"joinA")));}
    row.append(acts);l.append(row);}
  s.append(l,el("p","lead",T("switchHint")));
  if(asSeleb())s.append(btn("btn ghost block",T("viewMySeleb"),()=>go("seleb",{id:sel.id})));
  if(S.as)s.append(btn("btn dark block",T("logout"),logout));
  g.append(s);
  const s2=el("section","section");s2.append(btn("btn ghost block",T("showWelcome"),()=>{S.stack=[];S.route={v:"welcome"};render();}));
  g.append(s2,el("div","foot",T("acctNote")),el("div","foot",T("testNote")+" · "+T("about2")));
  return g;
}

/* ---------- boot ---------- */
render();
(async function boot(){
  const c=window.claude;
  try{if(c&&typeof c.use==="function"){[S.db,S.user,S.assets,S.downloads]=await Promise.all([c.use("db"),c.use("user"),c.use("assets"),c.use("downloads")]);}}catch(e){}
  if(S.user){try{S.uid=await S.user.id();}catch(e){}try{const w=await S.user.can("data.write");if(w===false)S.canWrite=false;}catch(e){}}
  if(!S.db){S.loaded=true;render();toast(T("noDb"));return;}
  // Live updates must not rebuild a form the viewer is typing in.
  const typing=()=>{const a=document.activeElement;return !!(a&&$("app").contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));};
  let got=0,dirty=false;const done=()=>{got++;if(got>=3)S.loaded=true;
    if(S.busy||["joinA","joinB","request"].includes(S.route.v)||typing()){dirty=true;renderTabbar();}else render();};
  S.flush=()=>{if(dirty&&!typing()){dirty=false;render();}};
  document.addEventListener("focusout",()=>setTimeout(()=>{if(dirty&&!typing()&&!["joinA","joinB","request"].includes(S.route.v)){dirty=false;render();}},0));
  const sub=(path,key)=>S.db.collection(path).onSnapshot(snap=>{S[key]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));done();},()=>{done();});
  sub("selebs","selebs");sub("fans","fans");sub("requests","requests");
})();
})();
</script>
