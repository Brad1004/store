<title>Tokokita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --surface-2:#E9ECF2; --line:#D9DEE8;
  --ink:#141A33; --ink-2:#434A66; --muted:#737A94;
  --navy:#14213D; --navy-ink:#F4F6FB;
  --mango:#FCA311; --mango-ink:#1F1400; --mango-soft:#FFF0D1;
  --ok:#17875A; --ok-soft:#DCF2E7; --bad:#C23B30; --bad-soft:#F9DEDB; --info:#2F5BD3; --info-soft:#E1E9FB;
  --shadow:0 12px 30px -14px rgba(20,33,61,.35);
  --font:"Figtree","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#0D1120; --surface:#161B2E; --surface-2:#1F2640; --line:#2A3252;
    --ink:#EDF0F8; --ink-2:#B7BDD3; --muted:#8990AA;
    --navy:#0A1022; --navy-ink:#EDF0F8;
    --mango:#FFB23E; --mango-ink:#1F1400; --mango-soft:#3A2A0C;
    --ok:#4CC08B; --ok-soft:#133126; --bad:#EF6B67; --bad-soft:#3D1D1C; --info:#7FA2FF; --info-soft:#1C2750;
    --shadow:0 12px 30px -14px rgba(0,0,0,.7);}
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0D1120; --surface:#161B2E; --surface-2:#1F2640; --line:#2A3252;
  --ink:#EDF0F8; --ink-2:#B7BDD3; --muted:#8990AA;
  --navy:#0A1022; --navy-ink:#EDF0F8;
  --mango:#FFB23E; --mango-ink:#1F1400; --mango-soft:#3A2A0C;
  --ok:#4CC08B; --ok-soft:#133126; --bad:#EF6B67; --bad-soft:#3D1D1C; --info:#7FA2FF; --info-soft:#1C2750;
  --shadow:0 12px 30px -14px rgba(0,0,0,.7);}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--mango);outline-offset:2px}
.app{max-width:640px;margin:0 auto;min-height:100%;padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
.gutter{padding-inline:16px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;padding:12px 16px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:7px;font-weight:900;font-size:21px;letter-spacing:-.03em;white-space:nowrap}
.brand .mk{width:26px;height:26px;border-radius:8px;background:var(--mango);display:grid;place-items:center}
.brand .mk svg{width:17px;height:17px}
.brand b{color:var(--mango);font-weight:900}
.sp{flex:1}
.iconbtn{border:0;background:var(--surface);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 0 var(--line);flex:none}
.pillbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 11px;font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.pillbtn.m-cust{border-color:var(--info);color:var(--info)}
.pillbtn.m-shop{border-color:var(--mango);color:color-mix(in srgb,var(--mango) 70%,var(--ink))}
.testtag{font-size:11px;font-weight:800;color:var(--muted);background:var(--surface-2);border-radius:99px;padding:3px 8px;white-space:nowrap}
@media (max-width:400px){.top .testtag{display:none}}

/* welcome */
.welcome{min-height:100%;display:flex;flex-direction:column;background:var(--navy);color:var(--navy-ink);padding:26px 20px calc(26px + env(safe-area-inset-bottom,0px))}
.welcome .brand{font-size:30px}
.welcome .mid{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.welcome h1{font-size:30px;line-height:1.2;font-weight:900}
.welcome p{margin:0;color:color-mix(in srgb,var(--navy-ink) 76%,transparent);max-width:36ch}
.demo-strip{display:flex;gap:6px;margin:18px 0 4px;flex-wrap:wrap}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.choice{display:flex;align-items:center;gap:14px;text-align:left;border:0;border-radius:18px;padding:16px;cursor:pointer;background:rgba(255,255,255,.08);color:var(--navy-ink)}
.choice.primary{background:var(--mango);color:var(--mango-ink)}
.choice .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:900;background:rgba(255,255,255,.14);flex:none}
.choice.primary .ic{background:rgba(31,20,0,.12)}
.choice b{display:block;font-size:16px}.choice small{display:block;font-size:13px;opacity:.8}
.linkbtn{border:0;background:none;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:12px;font-weight:700}
.welcome .note{font-size:12px;opacity:.7;text-align:center}

/* sections */
.section{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.shead h2{font-size:17px;font-weight:800}
.shead small{color:var(--muted);font-size:12.5px}
.pagetitle{font-size:22px;font-weight:900;margin-top:4px}
.lead{color:var(--ink-2);font-size:14px;margin:4px 0 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--mango);color:var(--mango-ink);border-color:var(--mango)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--mango);color:var(--mango-ink);border-color:var(--mango)}}

/* now banner */
.now{border-radius:22px;background:var(--navy);color:var(--navy-ink);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.now .clock{display:flex;align-items:baseline;gap:8px;font-size:13px;color:color-mix(in srgb,var(--navy-ink) 70%,transparent)}
.now .clock b{font-size:22px;color:var(--navy-ink);font-variant-numeric:tabular-nums;font-weight:900}
.now h1{font-size:20px;font-weight:900;line-height:1.3}
.best{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.08);border:0;border-radius:16px;padding:10px;text-align:left;color:inherit;cursor:pointer}
.best .tx{flex:1;min-width:0}.best b{display:block}.best small{opacity:.75;font-size:12.5px}

/* shop cards */
.shopcard{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:20px;padding:12px;box-shadow:0 1px 0 var(--line);border:0;text-align:left;cursor:pointer;width:100%}
.shopcard .hd{display:flex;gap:12px;align-items:center}
.cover{width:62px;height:62px;border-radius:16px;display:grid;place-items:center;flex:none;position:relative;color:#fff}
.cover svg{width:28px;height:28px}
.banner{position:relative;margin-top:4px;border-radius:22px;overflow:hidden;aspect-ratio:16/9;max-height:260px;width:100%;background:var(--surface-2)}.banner img{width:100%;height:100%;object-fit:cover;display:block}.banner .topoff{position:absolute;right:12px;bottom:12px;box-shadow:var(--shadow)}
.cover.pic{overflow:hidden;background:var(--surface-2)}.cover.pic img{width:100%;height:100%;object-fit:cover;display:block}
.cover.lg{width:84px;height:84px;border-radius:24px}.cover.lg svg{width:42px;height:42px}
.shopcard .tx{flex:1;min-width:0}
.shopcard b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{color:var(--mango);font-weight:800;font-size:12.5px}
.samp{font-size:10.5px;font-weight:800;color:var(--muted);background:var(--surface-2);border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:2px}
.topoff{flex:none;text-align:center;background:var(--mango);color:var(--mango-ink);border-radius:14px;padding:6px 9px;line-height:1.1}
.topoff b{font-size:18px;font-weight:900;display:block}.topoff small{font-size:10.5px;font-weight:700}

/* time strip: the signature element */
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.strip::-webkit-scrollbar{display:none}
.slot{flex:none;min-width:70px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:7px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;color:var(--ink)}
.slot .t{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.slot .o{font-weight:900;font-size:15px;color:color-mix(in srgb,var(--mango) 75%,var(--ink))}
.slot .s{font-size:10.5px;color:var(--muted);font-weight:700;white-space:nowrap}
.slot .tag{font-size:10px;font-weight:800;color:var(--info);white-space:nowrap}
.slot.hot{border-color:var(--mango);background:var(--mango-soft)}
.slot.past,.slot.full{opacity:.4;cursor:default}
.slot[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:var(--navy-ink)}
.slot[aria-pressed="true"] .o,.slot[aria-pressed="true"] .s,.slot[aria-pressed="true"] .tag{color:var(--navy-ink)}
.strip.big .slot{min-width:84px;padding:10px}

/* detail */
.prof{display:flex;gap:14px;align-items:center;margin-top:6px}
.prof h1{font-size:22px;font-weight:900}
.box{background:var(--surface);border-radius:18px;padding:14px;box-shadow:0 1px 0 var(--line);display:flex;flex-direction:column;gap:10px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.kv span{color:var(--muted)}
.fine{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:12px;padding:10px 12px}
.daytabs{display:flex;gap:6px}
.sticky{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(66px + env(safe-area-inset-bottom,0px));width:min(640px,100%);padding:10px 16px;box-sizing:border-box;z-index:6;background:linear-gradient(transparent,var(--bg) 30%)}

/* buttons & forms */
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:15px;cursor:pointer;background:var(--mango);color:var(--mango-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.block{width:100%}.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.dark{background:var(--navy);color:var(--navy-ink)}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:default}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.form{display:flex;flex-direction:column;gap:14px;margin-top:10px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;font-weight:800;color:var(--ink-2)}
.field small{font-size:12px;color:var(--muted)}
.input{width:100%;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13.5px;font-weight:700;cursor:pointer}
.seg input:checked+span{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.seg input:focus-visible+span{outline:2px solid var(--mango);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2)}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--mango)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:800;cursor:pointer}
.stepper b{font-size:20px;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}

/* slot editor */
.slotrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr) minmax(0,.9fr) minmax(0,1.3fr) auto;gap:6px;align-items:center}
.slotrow .input{padding:8px;font-size:14px}
.slotrow .x{border:0;background:none;color:var(--bad);font-size:20px;cursor:pointer;padding:4px}
.slothead{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr) minmax(0,.9fr) minmax(0,1.3fr) 28px;gap:6px;font-size:11.5px;font-weight:800;color:var(--muted)}

/* bookings */
.bk{background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 0 var(--line)}
.bk .hd{display:flex;gap:10px;align-items:center}
.bk .hd .tx{flex:1;min-width:0}.bk .hd b{display:block}.bk .hd small{color:var(--muted);font-size:12.5px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:900;font-size:26px;letter-spacing:.12em;text-align:center;background:var(--mango-soft);border:2px dashed var(--mango);border-radius:14px;padding:10px;color:var(--ink)}
.st{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:800;white-space:nowrap;background:var(--sb);color:var(--sc)}
.st-booked{--sb:var(--info-soft);--sc:var(--info)}.st-visited{--sb:var(--ok-soft);--sc:var(--ok)}.st-cancelled{--sb:var(--surface-2);--sc:var(--muted)}.st-noshow{--sb:var(--bad-soft);--sc:var(--bad)}
.rate{display:flex;gap:4px}.rate button{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--line);padding:2px}.rate button.on{color:var(--mango)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border-radius:14px;padding:10px;text-align:center;box-shadow:0 1px 0 var(--line)}
.stat b{display:block;font-size:20px;font-weight:900;font-variant-numeric:tabular-nums}.stat small{font-size:11.5px;color:var(--muted)}
.verify{display:flex;gap:8px}.verify .btn{flex:none;white-space:nowrap}.verify .input{text-transform:uppercase;font-family:ui-monospace,Menlo,monospace;letter-spacing:.1em;font-weight:800}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px;background:var(--surface);border-radius:18px}
.list{display:flex;flex-direction:column;gap:10px}

/* tab bar, sheets, toast */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(640px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:7}
.tabbar button{border:0;background:none;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:800;color:var(--muted);cursor:pointer}
.tabbar button[aria-current="page"]{color:color-mix(in srgb,var(--mango) 80%,var(--ink))}
.tabbar svg{width:22px;height:22px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,30,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(640px,100%);max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.sheet h3{font-size:18px;font-weight:900}.sheet p{margin:0;color:var(--ink-2);font-size:14px}
.acct{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px}
.acct .tx{flex:1;min-width:0}.acct b{display:block}.acct small{color:var(--muted);font-size:12.5px}
.acct.on{border-color:var(--mango);background:var(--mango-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:30;max-width:calc(100% - 40px);text-align:center}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:22px 0 8px}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<div class="app" id="app"></div>
<nav class="tabbar" id="tabbar" aria-label="menu" hidden></nav>
<div class="toast" id="toast" role="status" hidden></div>

// 새로 등록한 가게는 업종에 맞는 사진 중 아직 안 쓴 것을 자동 배정 (겹치면 아이콘)
const PHOTO_POOL={eatery:[6,7,8,9,10,11],cafe:[12,13,14,15],bakery:[],salon:[],barber:[]};
let pmap=new Map(),pkey="";
function assignPhotos(){const list=S.shops.slice().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)||String(a.id).localeCompare(String(b.id)));
  const key=list.map(x=>x.id+":"+x.cat+":"+(x.photo??"")).join("|");if(key===pkey)return;pkey=key;pmap=new Map();const used=new Set();
  for(const x of list)if(Number.isInteger(x.photo)&&PHOTOS[x.photo]){used.add(x.photo);pmap.set(x.id,x.photo);}
  for(const x of list){if(pmap.has(x.id)||x.photo===-1)continue;const k=(PHOTO_POOL[x.cat]||[]).find(i=>!used.has(i));if(k!=null){used.add(k);pmap.set(x.id,k);}}}
function photoOf(shop){if(!shop||!shop.id)return null;assignPhotos();const k=pmap.get(shop.id);return k==null?null:PHOTOS[k];}

/* ---------- helpers ---------- */
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function btn(cls,text,fn){const b=el("button",cls,text);b.type="button";if(fn)b.addEventListener("click",fn);return b;}
const $=id=>document.getElementById(id);
let toastT;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3000);}
function wibNow(){const p=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Jakarta",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(new Date());const [h,m]=p.split(":").map(Number);return h*60+m;}
function today(){try{return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Jakarta"}).format(new Date());}catch(e){return new Date().toISOString().slice(0,10);}}
function addDays(s,n){const d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
const mins=t=>{const [h,m]=String(t||"0:0").split(":").map(Number);return h*60+(m||0);};
const hhmm=m=>String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
function code(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="TK-";for(let i=0;i<4;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
function cover(shop,lg){const src=photoOf(shop);if(src){const c=el("div","cover pic"+(lg?" lg":""));const i=el("img");i.src=src;i.alt="";i.decoding="async";c.append(i);c.setAttribute("aria-hidden","true");return c;}
  const c=el("div","cover"+(lg?" lg":""));c.style.background="linear-gradient(145deg,"+(CAT_COLOR[shop.cat]||"#555")+",color-mix(in srgb,"+(CAT_COLOR[shop.cat]||"#555")+" 60%,#000))";c.innerHTML=CAT_ICON[shop.cat]||CAT_ICON.eatery;c.setAttribute("aria-hidden","true");return c;}

/* ---------- state ---------- */
const S={db:null,user:null,uid:null,canWrite:null,loaded:false,shops:[],custs:[],bookings:[],
  route:lsGet("tk.seen",false)?{v:"home"}:{v:"welcome"},stack:[],area:"all",cat:"all",sort:"off",as:lsGet("tk.as",null),pending:null,busy:false};
const myShop=()=>S.uid&&S.shops.find(s=>s.id===S.uid);
const myCust=()=>S.uid&&S.custs.find(s=>s.id===S.uid);
const asCust=()=>S.as==="cust"?myCust():null;
const asShop=()=>S.as==="shop"?myShop():null;
function login(role){const reg=role==="cust"?myCust():myShop();if(!reg){go(role==="cust"?"joinCust":"joinShop");return;}S.as=role;lsSet("tk.as",role);toast(T("loggedIn",{r:T(role==="cust"?"mCust":"mShop")}));S.stack=[];tab(role==="shop"?"bookings":"home");}
function logout(){S.as=null;lsSet("tk.as",null);toast(T("loggedOut"));S.stack=[];tab("home");}
function go(v,p){if(S.route.v!=="welcome")S.stack.push(S.route);S.route=Object.assign({v},p||{});render();window.scrollTo(0,0);}
function back(){S.route=S.stack.pop()||{v:"home"};render();}
function tab(v){S.stack=[];S.route={v};render();window.scrollTo(0,0);}

// 자리·할인 계산
function slotsOf(s){return (s.slots||[]).slice().sort((a,b)=>mins(a.t)-mins(b.t));}
function takenAt(shopId,date,t){return S.bookings.filter(b=>b.shopUid===shopId&&b.date===date&&b.slot===t&&b.status!=="cancelled").reduce((a,b)=>a+(b.party||1),0);}
function slotState(shop,sl,date){const left=Math.max(0,(sl.seats||0)-takenAt(shop.id,date,sl.t));const past=date===today()&&mins(sl.t)<wibNow()-10;return {left,past,full:left<=0};}
function upcoming(shop){const d=today();return slotsOf(shop).map(sl=>Object.assign({date:d},sl,slotState(shop,sl,d))).filter(x=>!x.past&&!x.full);}
function bestNow(shop){const u=upcoming(shop).filter(x=>mins(x.t)-wibNow()<=240);return u.sort((a,b)=>b.off-a.off)[0]||null;}
function maxOff(shop){return Math.max(0,...slotsOf(shop).map(x=>x.off||0));}
function shopStats(id){const v=S.bookings.filter(b=>b.shopUid===id&&b.rating);return {count:v.length,rating:v.length?v.reduce((a,b)=>a+b.rating,0)/v.length:null};}

  vb.append(el("b",null,T("verifyTitle")),vf,out);sec.append(vb);g.append(sec);
  const s2=el("section","section");const h=el("div","shead");h.append(el("h2",null,T("todayList")));s2.append(h);
  const list=el("div","list");tb.filter(b=>b.status!=="cancelled").sort((a,b)=>mins(a.slot)-mins(b.slot)).forEach(b=>list.append(bookingCard(b,"shop")));if(!list.children.length)list.append(el("div","empty",T("noToday")));
  s2.append(list);g.append(s2);
  const s3=el("section","section");s3.append(btn("btn ghost block",T("editShop"),()=>go("joinShop")),btn("btn ghost block",T("viewShop"),()=>go("shop",{id:s.id})));g.append(s3);
  return g;
}

/* ---------- forms ---------- */
function field(label,input,hint){const l=el("label","field");l.append(el("span",null,label),input);if(hint)l.append(el("small",null,hint));return l;}
function inp(id,v,a){const i=el("input","input");i.id=id;i.value=v==null?"":v;Object.assign(i,a||{});return i;}
function sel(id,opts,cur){const s=el("select","input");s.id=id;for(const [k,v] of opts){const o=el("option",null,v);o.value=k;if(k===cur)o.selected=true;s.append(o);}return s;}
function consent(){const l=el("label","check");const i=el("input");i.type="checkbox";i.id="consent";i.required=true;l.append(i,el("span",null,T("consent")));return l;}
function viewJoinCust(){
  const cur=myCust()||{};const g=el("div","gutter");g.append(el("h1","pagetitle",T("joinCust")));const f=el("form","form");
  const nm=inp("c-name",cur.name,{maxLength:40,required:true});const ar=sel("c-area",AREAS.map(a=>[a,a]),cur.area||AREAS[0]);
  f.append(field(T("name"),nm),field(T("area"),ar));if(!cur.name)f.append(consent());const sb=el("button","btn block",cur.name?T("save"):T("register"));sb.type="submit";f.append(sb);
  f.addEventListener("submit",async e=>{e.preventDefault();if(!guard())return;if(!nm.value.trim()){nm.focus();return;}sb.disabled=true;
    try{await S.db.doc("custs/"+S.uid).set({name:nm.value.trim(),area:ar.value,uid:S.uid,createdAt:cur.createdAt||Date.now(),updatedAt:Date.now()});S.as="cust";lsSet("tk.as","cust");toast(T("registered"));
      const p=S.pending;S.pending=null;S.stack=[];S.route=p||{v:"home"};render();}catch(err){toast(werr(err));sb.disabled=false;}});
  g.append(f);return g;
}
const PRESET=[{t:"07:30",off:30,seats:8,tag:"s3"},{t:"10:00",off:20,seats:8,tag:"quiet"},{t:"14:00",off:30,seats:8,tag:"quiet"},{t:"15:30",off:20,seats:10,tag:"s1"},{t:"19:00",off:10,seats:10,tag:"none"},{t:"23:15",off:40,seats:6,tag:"s2"}];
function viewJoinShop(){
  const cur=myShop()||{};const g=el("div","gutter");g.append(el("h1","pagetitle",T("joinShop")),el("p","lead",T("joinShopS")));const f=el("form","form");
  const nm=inp("s-name",cur.name,{maxLength:50,required:true});const ct=sel("s-cat",CATS.map(c=>[c,T("cat_"+c)]),cur.cat||"eatery");const ar=sel("s-area",AREAS.map(a=>[a,a]),cur.area||AREAS[0]);
  const ad=inp("s-addr",cur.address,{maxLength:120,placeholder:T("addrPh")});const wa=inp("s-wa",cur.wa,{maxLength:20,placeholder:T("waPh"),inputMode:"tel"});
  const h1=inp("s-open",(cur.hours||"07:00–23:30").split("–")[0],{type:"time"});const h2=inp("s-close",(cur.hours||"07:00–23:30").split("–")[1],{type:"time"});
  const hw=el("div","row2");hw.append(h1,el("span",null,"–"),h2);h1.style.flex=h2.style.flex="1";
  const ab=el("textarea","input");ab.id="s-about";ab.maxLength=300;ab.value=cur.about||"";ab.placeholder=T("aboutPh");
  let slots=(cur.slots&&cur.slots.length?cur.slots:PRESET).map(x=>Object.assign({},x));
  const sb2=el("div","box");const rows=el("div");rows.style.cssText="display:flex;flex-direction:column;gap:6px";
  const drawRows=()=>{rows.replaceChildren();const hd=el("div","slothead");[T("colTime"),T("colOff"),T("colSeats"),T("colTag"),""].forEach(x=>hd.append(el("span",null,x)));rows.append(hd);
    slots.forEach((x,i)=>{const r=el("div","slotrow");const t=inp("sl-t-"+i,x.t,{type:"time"});const o=inp("sl-o-"+i,x.off,{type:"number",min:5,max:70,step:5,inputMode:"numeric"});const se=inp("sl-s-"+i,x.seats,{type:"number",min:1,max:99,inputMode:"numeric"});
      const tg=sel("sl-g-"+i,TAGS.map(k=>[k,k==="none"?"—":T("tag_"+k)]),x.tag||"none");
      t.addEventListener("change",()=>x.t=t.value);o.addEventListener("input",()=>x.off=Math.min(70,Math.max(0,Math.round(+o.value||0))));se.addEventListener("input",()=>x.seats=Math.max(1,Math.round(+se.value||1)));tg.addEventListener("change",()=>x.tag=tg.value);
      [t,o,se,tg].forEach((e,k)=>e.setAttribute("aria-label",[T("colTime"),T("colOff"),T("colSeats"),T("colTag")][k]+" "+(i+1)));
      const xb=btn("x","×",()=>{slots.splice(i,1);drawRows();});xb.setAttribute("aria-label","remove "+(i+1));r.append(t,o,se,tg,xb);rows.append(r);});};
  drawRows();const acts=el("div","row2");acts.append(btn("btn sm ghost",T("addSlot"),()=>{slots.push({t:"12:00",off:10,seats:6,tag:"none"});drawRows();}),btn("btn sm ghost",T("preset"),()=>{slots=PRESET.map(x=>Object.assign({},x));drawRows();}));
  sb2.append(el("b",null,T("slotsTitle")),el("small",null,T("slotsHint")),rows,acts);
  f.append(field(T("shopName"),nm),field(T("cat"),ct),field(T("area"),ar),field(T("address"),ad),field(T("wa"),wa),field(T("hours"),hw),field(T("about"),ab),sb2);
  if(!cur.name)f.append(consent());const sb=el("button","btn block",cur.name?T("save"):T("register"));sb.type="submit";f.append(sb);
  f.addEventListener("submit",async e=>{e.preventDefault();if(!guard())return;if(!nm.value.trim()){nm.focus();return;}
    const clean=slots.filter(x=>/^\d\d:\d\d$/.test(x.t)).map(x=>({t:x.t,off:Math.min(70,Math.max(0,+x.off||0)),seats:Math.max(1,+x.seats||1),tag:x.tag||"none"}));sb.disabled=true;
    try{await S.db.doc("shops/"+S.uid).set({name:nm.value.trim(),cat:ct.value,area:ar.value,address:ad.value.trim(),wa:wa.value.trim(),hours:h1.value+"–"+h2.value,about:ab.value.trim(),slots:clean,uid:S.uid,createdAt:cur.createdAt||Date.now(),updatedAt:Date.now()});
      S.as="shop";lsSet("tk.as","shop");toast(cur.name?T("saved"):T("registered"));S.stack=[];tab("bookings");}catch(err){toast(werr(err));sb.disabled=false;}});
  g.append(f);return g;
}
function viewMe(){
  const g=el("div","gutter");const cur=asCust()||asShop();g.append(el("h1","pagetitle",T("me")),el("p","lead",cur?T("nowAs",{r:T(S.as==="cust"?"mCust":"mShop")})+" · "+cur.name:T("nowGuest")));
  const sec=el("section","section");
  for(const role of ["cust","shop"]){const reg=role==="cust"?myCust():myShop();const on=S.as===role&&reg;const row=el("div","acct"+(on?" on":""));row.style.background=on?"":"var(--surface)";
    const tx=el("div","tx");tx.append(el("small",null,T(role==="cust"?"roleB":"roleA")),el("b",null,reg?reg.name:T("notYet")));row.append(role==="shop"&&reg?cover(reg):el("span",null,role==="cust"?"🙂":"🏪"),tx);
    const a=el("div","row2");if(!reg)a.append(btn("btn sm",T("register"),()=>login(role)));else if(!on)a.append(btn("btn sm",T("loginAs",{r:T(role==="cust"?"mCust":"mShop")}),()=>login(role)));else a.append(btn("btn sm ghost",T("edit"),()=>go(role==="cust"?"joinCust":"joinShop")));
    row.append(a);sec.append(row);}
  if(S.as)sec.append(btn("btn dark block",T("logout"),logout));
  sec.append(btn("btn ghost block","↺ Tokokita",()=>{S.stack=[];S.route={v:"welcome"};render();}));
  g.append(sec,el("div","foot",T("acctNote")),el("div","foot",T("testNote")+" · "+T("about2")));return g;
}

/* ---------- boot ---------- */
document.documentElement.lang=lang;render();
setInterval(()=>{if(!S.busy&&!["joinShop","joinCust"].includes(S.route.v)&&!typing())render();},60000); // 시간대 지남·남은 분 갱신
function typing(){const a=document.activeElement;return !!(a&&$("app").contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));}
(async function boot(){
  const c=window.claude;try{if(c&&typeof c.use==="function")[S.db,S.user]=await Promise.all([c.use("db"),c.use("user")]);}catch(e){}
  if(S.user){try{S.uid=await S.user.id();}catch(e){}try{if(await S.user.can("data.write")===false)S.canWrite=false;}catch(e){}}
  if(!S.db){S.loaded=true;render();toast(T("noDb"));return;}
  let got=0,dirty=false;const done=()=>{got++;if(got>=3)S.loaded=true;if(["joinShop","joinCust"].includes(S.route.v)||typing()){dirty=true;renderTabbar();}else render();};
  document.addEventListener("focusout",()=>setTimeout(()=>{if(dirty&&!typing()&&!["joinShop","joinCust"].includes(S.route.v)){dirty=false;render();}},0));
  const sub=(p,k)=>S.db.collection(p).onSnapshot(sn=>{S[k]=sn.docs.map(d=>Object.assign({id:d.id},d.data()));done();},()=>done());
  sub("shops","shops");sub("custs","custs");sub("bookings","bookings");
})();
})();
